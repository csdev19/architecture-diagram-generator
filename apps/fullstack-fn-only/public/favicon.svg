<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The icon is one of the tiles the tool draws: a white rounded square with a
    single mark on it. The colours are the renderer's own — TILE_LIGHT_FILL,
    TILE_LIGHT_BORDER and NAME_TEXT from `constants/diagram.ts` — so the mark in
    a browser tab is the same object the canvas is made of.
  -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="33" fill="#0f172a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="central">D</text>
</svg>
