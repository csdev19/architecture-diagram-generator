name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    # A release PR only touches `package.json` and `CHANGELOG.md`. Running the
    # full matrix on a mechanical version bump buys nothing and delays the cut.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `bun run format:check`, so CI and a local check are the same command and
      # both read `.oxfmtrc.json`. Its `ignorePatterns` is what keeps generated
      # files out: release-please rewrites CHANGELOG.md and
      # .release-please-manifest.json in its own style on every release, so
      # formatting them is a fight that restarts each time.
      - name: Check formatting
        run: bun run format:check

      - name: Build packages
        run: bun run build --filter='@diagram-tool/*'

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build app
        working-directory: apps/fullstack-fn-only
        run: bun run build
