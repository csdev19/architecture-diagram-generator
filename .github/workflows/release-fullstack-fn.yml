name: Release Fullstack App 🚀

# Deploys apps/fullstack-fn-only to Cloudflare Workers. Trigger: the tag cut by
# release-please.yml. The tag ref is what gets checked out, so the deploy is
# exactly the released commit and can never drift from it.
#
# Re-deploy / rollback: re-run THIS workflow's run for the wanted tag from the
# Actions UI — that re-checks out the tag. `workflow_dispatch` is different: it
# checks out whatever ref you pick, defaulting to the default branch, so it can
# ship unreleased commits. Escape hatch only.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # Stateless deploy — the Worker carries no migration step, so newest wins.
  # Flip to `false` the day a migration runs here: cancelling between deploy and
  # migrate leaves a schema half-applied.
  cancel-in-progress: true

jobs:
  release-fullstack-fn:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages only
        run: bun run build --filter='@diagram-tool/*'

      - name: Build app
        working-directory: apps/fullstack-fn-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: bun run build

      # `secrets:` names the variables uploaded to the Worker's runtime. The set
      # has to match `fullstackServerEnvSchema`, which is parsed at module scope
      # in `src/env/server.ts` — a missing one is not a degraded feature, it is
      # a Worker that throws on its first request.
      #
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are deploy credentials
      # and deliberately not in that list: the Worker never reads them, and
      # uploading them would hand its runtime the key to redeploy itself.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/fullstack-fn-only
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            JWT_PRIVATE_JWK
            JWT_KID
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          JWT_PRIVATE_JWK: ${{ secrets.JWT_PRIVATE_JWK }}
          JWT_KID: ${{ secrets.JWT_KID }}
